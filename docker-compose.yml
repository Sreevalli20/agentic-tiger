version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: graphprobe-backend
    ports:
      - "8000:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=${PORT:-8000}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://localhost
    volumes:
      - ./data:/app/data
      - ./evaluation:/app/evaluation
      - ./hackathon-resources:/app/hackathon-resources:ro
    env_file:
      - .env
    networks:
      - graphprobe-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: graphprobe-frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - graphprobe-network
    restart: unless-stopped

networks:
  graphprobe-network:
    driver: bridge

