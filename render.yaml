services:
  - type: web
    name: graphprobe-ai-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/init_corpus.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        sync: false
      - key: TG_HOST
        sync: false
      - key: TG_SECRET
        sync: false
      - key: TG_GRAPHNAME
        value: Transaction_Fraud
      - key: GOOGLE_API_KEY
        sync: false
